---
apiVersion: devopstoolkit.ai/v2
kind: Cluster
metadata:
  name: cluster-01
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: aws
        cluster: eks
  parameters:
    nodeSize: small
    minNodeCount: 3
    namespaces:
      - production
---
apiVersion: v1
kind: Secret
metadata:
  name: silly-demo-db-password
data:
  password: cG9zdGdyZXM=
---
apiVersion: devopstoolkit.live/v1beta1
kind: SQL
metadata:
  name: silly-demo-db
spec:
  version: "16.15"
  size: small
  region: us-east-1
  databases:
    - sillydemodb
  crossplane:
    compositionSelector:
      matchLabels:
        provider: aws
        db: postgresql
---
# Copies the DB connection Secret into the new cluster so the app can use it
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: silly-demo-db-remote-secret
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: cluster-01
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: silly-demo-db
        namespace: a-team
        fieldPath: data
      toFieldPath: data
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: silly-demo-db
        namespace: production
---
apiVersion: devopstoolkit.live/v1beta1
kind: App
metadata:
  name: silly-demo
spec:
  image: c8n.io/vfarcic/silly-demo
  tag: "1.4.52"
  port: 8080
  host: silly-demo.acme.com
  providerConfigName: cluster-01
  targetNamespace: production
  db:
    secret: silly-demo-db
    name: sillydemodb
  crossplane:
    compositionSelector:
      matchLabels:
        type: backend
