apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: dot-sql
  annotations:
    meta.crossplane.io/maintainer: Viktor Farcic (@vfarcic)
    meta.crossplane.io/source: github.com/vfarcic/crossplane-tutorial
    meta.crossplane.io/license: MIT
    meta.crossplane.io/description: Fully operational PostgreSQL databases in AWS, Google Cloud Platform, and Azure.
    meta.crossplane.io/readme: A Configuration package that defines a SQL type that can be used to create and provision fully operational databases in AWS, Google Cloud Platform, and Azure.
spec:
  crossplane:
    version: ">=v2.0.0"
  dependsOn:
  - provider: xpkg.crossplane.io/crossplane-contrib/provider-aws-ec2
    version: ">=v2.9.0"
  - provider: xpkg.crossplane.io/crossplane-contrib/provider-aws-rds
    version: ">=v2.9.0"
  - provider: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbforpostgresql
    version: ">=v2.8.0"
  - provider: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql
    version: ">=v3.1.0"
  - provider: xpkg.crossplane.io/crossplane-contrib/provider-sql
    version: ">=v0.16.2"
  - function: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
    version: ">=v0.11.0"
  - function: xpkg.crossplane.io/crossplane-contrib/function-go-templating
    version: ">=v0.13.0"
  - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: ">=v0.7.0"
  # - provider: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
  #   version: ">=v1.4.1"
