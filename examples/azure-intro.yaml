---
apiVersion: devopstoolkit.ai/v2
kind: Cluster
metadata:
  name: cluster-01
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: azure
        cluster: aks
  parameters:
    nodeSize: small
    minNodeCount: 3
    namespaces:
    - production
---
apiVersion: v1
kind: Secret
metadata:
  name: -password
data:
  password: cG9zdGdyZXM=
---
apiVersion: devopstoolkit.live/v1beta1
kind: SQL
metadata:
  name: 
spec:
  version: "11"
  size: small
  region: eastus
  databases:
  - silly-demo-db
  crossplane:
    compositionSelector:
      matchLabels:
        provider: azure
        db: postgresql
---
# Copies the DB connection Secret into the new cluster so the app can use it
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: silly-demo-db-secret
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: cluster-01
  references:
  - patchesFrom:
      apiVersion: v1
      kind: Secret
      name: 
      namespace: a-team
      fieldPath: data
    toFieldPath: data
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: silly-demo-db
        namespace: production
---
apiVersion: devopstoolkit.live/v1beta1
kind: App
metadata:
  name: silly-demo
spec:
  image: c8n.io/vfarcic/silly-demo
  tag: "1.4.52"
  port: 8080
  host: silly-demo.acme.com
  providerConfigName: cluster-01
  targetNamespace: production
  db:
    secret: silly-demo-db
    name: silly-demo-db
  crossplane:
    compositionSelector:
      matchLabels:
        type: backend
