---
# dot-sql declares some dependencies on xpkg.upbound.io and others on
# xpkg.crossplane.io, which Crossplane can't reconcile with dot-kubernetes.
# Skip its automatic resolution and install what it needs explicitly.
apiVersion: pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-sql
spec:
  package: xpkg.upbound.io/devops-toolkit/dot-sql:v2.2.14
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-aws-rds
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-rds:v2.9.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-azure-dbforpostgresql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-azure-dbforpostgresql:v2.8.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-gcp-sql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql:v3.1.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: crossplane-contrib-provider-sql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-sql:v0.16.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: crossplane-contrib-function-status-transformer
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-status-transformer:v0.5.2
